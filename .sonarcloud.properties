# pluginsPage/legacy is the pre-marketplace plugins page, resurrected verbatim from develop
# behind the 'marketplace' localStorage flag. It intentionally duplicates the code it forked
# from and carries develop's existing findings; it is deleted, not maintained, when the flag
# ships — so it is excluded from analysis rather than "fixed".
sonar.exclusions=app/src/pages/instance/pluginsPage/legacy/**
